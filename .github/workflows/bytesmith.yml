name: ByteSmith Advisory

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: bytesmith-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  advisory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the exact pull-request head with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Run ByteSmith Verify
        id: bytesmith
        continue-on-error: true
        uses: ./apps/github-action
        with:
          publish: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          github-token: ${{ github.token }}

      - name: Preserve the advisory conclusion
        if: always()
        run: echo "ByteSmith conclusion=${{ steps.bytesmith.outputs.conclusion }}"
